name: build-desktop

on:
  # 构建接线/补丁/打包变化时立即跑一次 resolve（push 事件），不必等下一个 5 分钟窗口。
  # 只匹配会影响产物的路径，纯文档改动不触发。
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'ci/**'
      - 'patches/**'
      - 'packaging/**'
      - 'launcher/**'
  schedule:
    # AUR `-git` 语义：每 5 分钟看一次 master 的当前 head（resolve 只花约 10 秒）。
    # master 构建有 1 小时 cooldown，避免 359MB 包刷爆带宽；上游新 tag 会绕过 cooldown 立即构建。
    - cron: '*/5 * * * *'
  # 外部 watcher（VPS/本机 systemd timer，5 分钟）用 PAT 调用：
  #   gh api repos/<this>/dispatches -f event_type=dsh-upstream
  # 解决 GitHub schedule 实测长期延迟/不触发的问题；见 docs/upstream-watch.md。
  repository_dispatch:
    types: [dsh-upstream]
  workflow_dispatch:
    inputs:
      ref:
        description: '上游 ref（master / tag / 40 位 SHA）'
        required: false
        default: 'master'
      pkgrel:
        description: 'pkgrel（留空自动：新 SHA=1；同 SHA 重建=上次+1）'
        required: false
        default: ''
      min_interval:
        description: 'master 构建最小间隔（秒；新 tag 绕过）'
        required: false
        default: '3600'
      force:
        description: '强制重建（即使同 SHA 的 release 已存在）'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: build-desktop
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      pkgver: ${{ steps.resolve.outputs.pkgver }}
      pkgrel: ${{ steps.resolve.outputs.pkgrel }}
      archive_sha256: ${{ steps.resolve.outputs.archive_sha256 }}
      base_tag: ${{ steps.resolve.outputs.base_tag }}
      ahead: ${{ steps.resolve.outputs.ahead }}
      upstream_date: ${{ steps.resolve.outputs.upstream_date }}
      last_version: ${{ steps.resolve.outputs.last_version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref || 'master' }}
          INPUT_PKGREL: ${{ inputs.pkgrel }}
          INPUT_MIN_INTERVAL: ${{ inputs.min_interval || '3600' }}
          INPUT_FORCE: ${{ inputs.force || 'false' }}
        run: ./ci/resolve-upstream.sh

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: build in Arch container
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          PKGVER: ${{ needs.resolve.outputs.pkgver }}
          PKGREL: ${{ needs.resolve.outputs.pkgrel }}
          ARCHIVE_SHA256: ${{ needs.resolve.outputs.archive_sha256 }}
          LAST_VERSION: ${{ needs.resolve.outputs.last_version }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            -e SHA -e PKGVER -e PKGREL -e ARCHIVE_SHA256 -e LAST_VERSION \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            archlinux:base-devel bash -lc './ci/ci-build.sh'
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PKGVER: ${{ needs.resolve.outputs.pkgver }}
          PKGREL: ${{ needs.resolve.outputs.pkgrel }}
          SHA: ${{ needs.resolve.outputs.sha }}
          REF: ${{ needs.resolve.outputs.ref }}
          ARCHIVE_SHA256: ${{ needs.resolve.outputs.archive_sha256 }}
          UPSTREAM_DATE: ${{ needs.resolve.outputs.upstream_date }}
          AHEAD: ${{ needs.resolve.outputs.ahead }}
          BASE_TAG: ${{ needs.resolve.outputs.base_tag }}
        run: ./ci/publish-release.sh

      # 发布成功后主动通知 Rodriguez，立即镜像；不再等它的定时轮询。
      # 需要 secret RODRIGUEZ_DISPATCH_TOKEN：fine-grained PAT，仅 Rodriguez 仓
      # Contents: Read and write。没有配置时静默跳过，Rodriguez 侧每小时兜底。
      - name: dispatch to Rodriguez
        if: success()
        env:
          TOKEN: ${{ secrets.RODRIGUEZ_DISPATCH_TOKEN }}
          PKGVER: ${{ needs.resolve.outputs.pkgver }}
          PKGREL: ${{ needs.resolve.outputs.pkgrel }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "RODRIGUEZ_DISPATCH_TOKEN 未配置，跳过事件通知（由 Rodriguez 轮询兜底）"
            exit 0
          fi
          artifact=$(sed -n 's/^artifact=//p' out/latest | head -1)
          test -n "$artifact"
          test -f "out/$artifact"
          sha256=$(sha256sum "out/$artifact" | awk '{print $1}')
          payload=$(jq -n \
            --arg artifact "$artifact" \
            --arg sha256 "$sha256" \
            --arg pkgver "$PKGVER" \
            --arg pkgrel "$PKGREL" \
            --arg upstream_sha "$SHA" \
            '{event_type:"dsh-published",client_payload:{
              artifact:$artifact, artifact_sha256:$sha256,
              pkgver:$pkgver, pkgrel:$pkgrel, upstream_sha:$upstream_sha}}')
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/Moritz230127/rodriguez/dispatches" \
            --data-binary "$payload"
          echo "==> 已通知 Rodriguez：$artifact"

  notify:
    needs: [resolve, build]
    if: always() && (needs.resolve.result == 'failure' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: open or update ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ needs.resolve.outputs.sha || 'unknown' }}
          REF: ${{ needs.resolve.outputs.ref || 'unknown' }}
          PKGVER: ${{ needs.resolve.outputs.pkgver || 'unknown' }}
        run: |
          set -euo pipefail
          short=${SHA:0:7}
          title="CI failed: $short"

          gh label create ci-failure --color B60205 \
            --description "automated build failure" --force >/dev/null 2>&1 || true

          body=$(mktemp)
          log=$(mktemp)
          trap 'rm -f "$body" "$log"' EXIT
          gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --log-failed > "$log" 2>/dev/null || true
          {
            echo "Automatic build failed."
            echo
            echo "- run: $RUN_URL"
            echo "- upstream: \`$REF\` @ \`$SHA\`"
            echo "- pkgver: \`$PKGVER\`"
            echo
            echo "Most likely cause: a patch in \`patches/\` no longer applies, or the"
            echo "upstream Linux build changed. Reproduce locally with:"
            echo
            echo '```bash'
            echo 'cd ~/dsh-re/dsh-desktop-wayland'
            echo 'cp -aL packaging/. /tmp/pkgtest && cd /tmp/pkgtest'
            echo 'makepkg --nobuild --nocheck --nodeps'
            echo '```'
            echo
            echo "Failed log tail:"
            echo
            echo '```text'
            tail -60 "$log" 2>/dev/null || true
            echo '```'
          } > "$body"

          label_args=()
          label_names=$(gh label list -R "$GITHUB_REPOSITORY" --limit 100 --json name \
            --jq '.[].name' 2>/dev/null || true)
          if grep -qx 'ci-failure' <<<"$label_names"; then
            label_args+=(--label ci-failure)
          fi

          issue=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title \
            --jq '.[] | [.number, .title] | @tsv' \
            | awk -F '\t' -v s="$short" 'index($2, s) { print $1; exit }')

          if [[ -n ${issue:-} ]]; then
            gh issue comment "$issue" -R "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" \
              "${label_args[@]}" --body-file "$body"
          fi

  watcher-watchdog:
    # 纯观测，不参与构建：外部 watcher 每天发一次心跳（watcher-heartbeat 工作流），
    # 超过 48h 没有心跳就开/续写 watcher-stale issue。
    # schedule 被 GitHub 限流也只是晚几个小时发现——它监控的是“监控本身”。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: check watcher heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # 第一次部署心跳（VPS 换脚本）之前的宽限期，避免一上线就刷 issue。
          GRACE_UNTIL: '2026-12-02'
        run: |
          set -euo pipefail
          max_age=$((48 * 3600))
          now=$(date -u +%s)

          last=$(gh api "repos/$REPO/actions/workflows/watcher-heartbeat.yml/runs?per_page=1" \
                   --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || true)

          if [[ -z $last ]]; then
            if [[ $(date -u +%F) < ${GRACE_UNTIL} ]]; then
              echo "尚无 watcher 心跳；${GRACE_UNTIL} 之前算部署宽限期，跳过"
              exit 0
            fi
            reason="watcher 从未发过心跳：VPS 上的 upstream-watch.sh 可能还是加心跳之前的版本，或者 timer 没在跑。"
          else
            age=$(( now - $(date -u -d "$last" +%s) ))
            echo "最近一次心跳：$last（$((age / 3600)) 小时前）"
            if (( age < max_age )); then
              echo "心跳正常，无需处理"
              exit 0
            fi
            reason="最近一次 watcher 心跳是 $last，已 $((age / 3600)) 小时没有更新（阈值 48 小时）。"
          fi

          gh label create watcher-stale --color FBCA04 \
            --description "upstream watcher heartbeat missing" --force >/dev/null 2>&1 || true

          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          {
            echo "$reason"
            echo
            echo "心跳缺失不影响已经发布出去的包，但会退化实时性：上游 master/tag 变化后，"
            echo "构建只剩被 GitHub 限流的 schedule 兜底（实测每天 2–3 次），镜像也可能变慢。"
            echo
            echo "在 VPS 上排查："
            echo
            echo '```bash'
            echo 'sudo systemctl list-timers dsh-upstream-watch.timer --no-pager'
            echo 'sudo systemctl status dsh-upstream-watch.service --no-pager'
            echo 'sudo journalctl -u dsh-upstream-watch.service -n 50 --no-pager'
            echo '```'
            echo
            echo "常见原因："
            echo
            echo "1. VPS 上的 \`upstream-watch.sh\` 还是加心跳之前的版本 —— 重新 install 一次即可；"
            echo "2. PAT 过期（journal 里是 401）—— 更新 \`/etc/dsh-upstream-watch.env\`；"
            echo "3. timer 被停掉，或者 VPS 没开机。"
            echo
            echo "部署/更新步骤见 [docs/upstream-watch.md](../blob/main/docs/upstream-watch.md)。"
          } > "$body"

          issue=$(gh issue list -R "$REPO" --state open --label watcher-stale --limit 10 \
                    --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [[ -n ${issue:-} ]]; then
            gh issue comment "$issue" -R "$REPO" --body-file "$body"
          else
            gh issue create -R "$REPO" --title "watcher heartbeat missing" \
              --label watcher-stale --body-file "$body"
          fi
